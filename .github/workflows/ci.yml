name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: make check
      - name: Isolated native axis diagnostic
        if: always()
        run: |
          if [ -x .build/pen-pan-tests ]; then
            .build/pen-pan-tests --native-axis-probe
          fi
